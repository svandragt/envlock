<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="envlock icon: three books on a shelf, one lifted out with a lending tag">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#0f2238"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset=".35" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <g transform="translate(-12 4)">
  <!-- shelf -->
  <rect x="40" y="194" width="196" height="10" rx="5" fill="#8fa9c7"/>
  <g filter="url(#shadow)">
    <!-- book 1 -->
    <rect x="52" y="74" width="38" height="120" rx="6" fill="#2fb3a3"/>
    <rect x="52" y="96" width="38" height="7" fill="#1f8a7d"/>
    <rect x="52" y="164" width="38" height="7" fill="#1f8a7d"/>
    <rect x="52" y="74" width="38" height="120" rx="6" fill="url(#shine)"/>
    <!-- book 3 -->
    <rect x="142" y="62" width="38" height="132" rx="6" fill="#e8735a"/>
    <rect x="142" y="86" width="38" height="7" fill="#c2553f"/>
    <rect x="142" y="164" width="38" height="7" fill="#c2553f"/>
    <rect x="142" y="62" width="38" height="132" rx="6" fill="url(#shine)"/>
    <!-- book 2, lifted out: leased -->
    <g transform="translate(0 -26)">
      <rect x="97" y="86" width="38" height="108" rx="6" fill="#f2b84b"/>
      <rect x="97" y="106" width="38" height="7" fill="#cf9330"/>
      <rect x="97" y="164" width="38" height="7" fill="#cf9330"/>
      <rect x="97" y="86" width="38" height="108" rx="6" fill="url(#shine)"/>
    </g>
  </g>
  <!-- lending tag on a string from the lifted book -->
  <path d="M116 60 C 136 26, 192 30, 210 73" fill="none" stroke="#dbe6f3" stroke-width="3" stroke-linecap="round"/>
  <g transform="rotate(18 204 92)" filter="url(#shadow)">
    <path d="M186 60 h36 a6 6 0 0 1 6 6 v52 a6 6 0 0 1 -6 6 h-36 a6 6 0 0 1 -6 -6 v-52 a6 6 0 0 1 6 -6 z" fill="#f5f7fb"/>
    <circle cx="204" cy="72" r="4.5" fill="#0f2238"/>
    <!-- padlock on the tag -->
    <path d="M197 96 v-6 a7 7 0 0 1 14 0 v6" fill="none" stroke="#1e3a5f" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="193" y="95" width="22" height="17" rx="3.5" fill="#1e3a5f"/>
    <circle cx="204" cy="102.5" r="2.6" fill="#f5f7fb"/>
  </g>
  </g>
</svg>
